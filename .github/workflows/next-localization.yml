name: next-localization

on:
  pull_request:
    branches:
      - develop
      - feat/sn-008-host-language-settings
      - feat/sn-009-transient-language-transport
    paths:
      - '.github/workflows/next-localization.yml'
      - 'Snoop.Next.Localization/**'
      - 'Snoop.Next.Localization.Tests/**'
      - 'Snoop.Next.Localization.Demo/**'
      - 'Snoop.Host.SettingsSmoke/**'
      - 'Snoop/Snoop.csproj'
      - 'Snoop/Settings.cs'
      - 'Snoop/App.xaml.cs'
      - 'Snoop/Views/SettingsView.xaml'
      - 'Snoop/Views/SettingsView.xaml.cs'
      - 'Snoop/ProcessInfo.cs'
      - 'Snoop.Core/Data/TransientSettingsData.cs'
      - 'Snoop.Core/Infrastructure/SnoopManager.cs'
      - 'Snoop.Core/Infrastructure/SnoopPartsRegistry.cs'
      - 'Snoop.Core/Infrastructure/Helpers/ClipboardHelper.cs'
      - 'Snoop.Core/Infrastructure/Diagnostics/**'
      - 'Snoop.Core/Localization/**'
      - 'Snoop.Core/Snoop.Core.csproj'
      - 'Snoop.Core/Windows/**'
      - 'Snoop.Core/Views/**'
      - 'Snoop.Core/Controls/**'
      - 'Snoop.Core/ThemeManager.cs'
      - 'Snoop.Core/Themes/**'
      - 'Snoop.Core/PowerShell/**'
      - 'Snoop.Core/Styles.xaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-and-runtime:
    name: next-localization-unit-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion.MsBuild requires full history
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify inspector XAML resource references
        shell: pwsh
        run: |
          $resources = [xml](Get-Content -LiteralPath 'Snoop.Core/Localization/InspectorStrings.resx' -Raw)
          $keys = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($entry in $resources.root.data) {
            [void]$keys.Add([string]$entry.name)
          }
          $files = git ls-files -- 'Snoop.Core/*.xaml'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list inspector XAML files.' }
          if (!$files) { throw 'Inspector XAML files were not found.' }
          foreach ($file in $files) {
            $xaml = Get-Content -LiteralPath $file -Raw
            foreach ($reference in [regex]::Matches($xaml, '\{\w+:InspectorLoc\s+([\w.]+)\s*\}')) {
              $key = $reference.Groups[1].Value
              if (!$keys.Contains("en-US.$key") -or !$keys.Contains("zh-CN.$key")) {
                throw "Missing inspector resource pair for $key in $file"
              }
            }
          }
          Write-Host "Checked both languages for inspector resource references in $(@($files).Count) XAML files."
      - name: Compile the localization library against net462 and net10
        shell: pwsh
        run: |
          dotnet build Snoop.Next.Localization/Snoop.Next.Localization.csproj -c Release -f net462
          if ($LASTEXITCODE -ne 0) { throw 'net462 localization build failed' }
          dotnet build Snoop.Next.Localization/Snoop.Next.Localization.csproj -c Release -f net10.0-windows
          if ($LASTEXITCODE -ne 0) { throw 'net10 localization build failed' }
      - name: Compile interactive demo window (do not launch)
        shell: pwsh
        run: |
          dotnet build Snoop.Next.Localization.Demo/Snoop.Next.Localization.Demo.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WPF localization demo compilation failed' }
      - name: Build and run host/inspector UI smoke (CLR4, no external injection)
        shell: pwsh
        run: |
          $project = 'Snoop.Host.SettingsSmoke/Snoop.Host.SettingsSmoke.csproj'
          dotnet build $project -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Snoop host settings smoke compilation failed' }
          $smoke = 'bin/Release/net462/Snoop.Host.SettingsSmoke.exe'
          if (-not (Test-Path $smoke)) { throw "Missing CLR4 smoke executable: $smoke" }
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw 'Snoop host/inspector UI smoke failed' }
      - name: Check host-side DLL and explicit install manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'bin/Release/Snoop.Next.Localization.dll',
            'bin/Release/zh-CN/Snoop.Next.Localization.resources.dll')) {
            if (-not (Test-Path $file)) { throw "Missing host localization output: $file" }
          }

          $choco = Get-Content 'chocolatey/snoop.nuspec' -Raw
          $wix = Get-Content 'Snoop.wxs' -Raw
          if ($choco -notmatch 'Snoop.Next.Localization.dll' -or
              $choco -notmatch 'zh-CN\\Snoop.Next.Localization.resources.dll' -or
              $wix -notmatch 'Snoop.Next.Localization.dll' -or
              $wix -notmatch 'SnoopHostZhCn') {
            throw 'Host localization DLL or satellite resources absent from explicit package manifests'
          }

          Write-Host 'Host localization DLL and zh-CN satellite resources are included in explicit packaging manifests'
      - name: Verify localization reference is host-only
        shell: pwsh
        run: |
          $hostProj = Get-Content 'Snoop/Snoop.csproj' -Raw
          if ($hostProj -notmatch 'Snoop.Next.Localization.csproj') { throw 'Host project reference missing' }
          foreach ($file in @('Snoop.Core/Snoop.Core.csproj', 'Snoop.InjectorLauncher/Snoop.InjectorLauncher.csproj')) {
            $source = Get-Content $file -Raw
            if ($source -match 'Snoop.Next.Localization') { throw "Injected project unexpectedly references localization: $file" }
          }
          Write-Host 'Localization project reference is host-only in source projects'
      - name: Run isolated localization tests (no injection)
        shell: pwsh
        run: |
          dotnet test Snoop.Next.Localization.Tests/Snoop.Next.Localization.Tests.csproj -c Release --logger trx --results-directory output/next-localization-tests
          if ($LASTEXITCODE -ne 0) { throw 'Localization tests failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-localization-test-results
          path: output/next-localization-tests
          if-no-files-found: warn
