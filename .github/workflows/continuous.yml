name: continuous

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - develop

permissions:
  contents: read

# CI has no need to send NUKE telemetry. Opting out avoids the
# telemetry-only MSBuild project-model load that emits the suppressed
# NuGet.Frameworks assembly-mismatch warning on the .NET 10 runner.
# Keep actual build errors and NuGet security auditing enabled.
env:
  NUKE_TELEMETRY_OPTOUT: '1'

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion/Nuke need history to determine version information.
          fetch-depth: 0
      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          # Retain .NET 6 for the existing legacy WPF test targets.
          dotnet-version: '6.0.400'
          # Single source of truth for the active Snoop build SDK (10.0.400).
          global-json-file: global.json
      - name: Verify SDK selection
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
          $pinned = (Get-Content -Raw -Path ./global.json | ConvertFrom-Json).sdk.version
          $expected = [version]$pinned
          $selectedText = (& dotnet --version).Trim()
          # dotnet --version may include -preview/-rc when allowPrerelease is true.
          $selectedNumeric = $selectedText -replace '-.*$', ''
          if ($selectedNumeric -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Unexpected .NET SDK version format: $selectedText"
          }
          $selected = [version]$selectedNumeric
          # Regression guard: stable and prerelease output must parse identically.
          foreach ($example in @('10.0.400', '10.0.400-preview.1', '10.0.400-rc.2')) {
            $core = $example -replace '-.*$', ''
            if ([version]$core -ne [version]'10.0.400') {
              throw "SDK version parser regression for $example"
            }
          }
          Write-Host "SDK pinned in global.json: $pinned"
          Write-Host "SDK selected by dotnet: $selectedText"
          # global.json uses rollForward=feature: a newer feature band is allowed.
          if ($selected.Major -ne $expected.Major -or
              $selected.Minor -ne $expected.Minor -or
              $selected.Build -lt $expected.Build) {
            throw "Selected SDK $selectedText does not satisfy global.json SDK $pinned (feature roll-forward)."
          }
      - name: Run './build.cmd CI'
        run: ./build.cmd CI
      - uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: output/test-results
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts
