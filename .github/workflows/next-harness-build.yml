name: next-harness-build

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/next-harness-build.yml'
      - 'scripts/next/**'
      - 'docs/next/p0/**'
      - 'TestHarnesses/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    name: next-harness-compile-only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.400'
          global-json-file: global.json
      - name: Parse PowerShell smoke scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/next/Build-SnoopHarnesses.ps1', 'scripts/next/Start-SnoopSmokeSession.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $messages = ($parseErrors | ForEach-Object { $_.ToString() }) -join '; '
              throw "PowerShell parse error in $file : $messages"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Compile WPF smoke harnesses (no injection)
        shell: pwsh
        run: ./scripts/next/Build-SnoopHarnesses.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sn004-compile-manifest
          path: output/next-harness-build/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: sn009-clr4-multi-appdomain-harness
          path: output/next-harness-build/HelloWorld/net462/x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: sn009-clr4-multi-dispatcher-harness
          path: output/next-harness-build/MultipleDispatchers/net462/x64/
          if-no-files-found: error
